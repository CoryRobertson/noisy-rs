[package]
name = "noisy-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = "0.12.4"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
chrono = "0.4"
axum = "0.8"
serde = { version = "1.0", features = ["rc"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"